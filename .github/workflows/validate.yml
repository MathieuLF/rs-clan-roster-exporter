name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Ubuntu toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/setup-cloud.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: runner.os == 'Windows'
        with:
          node-version: '22.22.0'
      - name: Windows analyzer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Setup-Tools.ps1
      - name: Full offline validation
        shell: pwsh
        run: ./scripts/Test-Local.ps1 -Profile Full
      - name: Tracked files remain unchanged
        shell: bash
        run: git diff --exit-code && git diff --cached --exit-code
